name: Update Motorcycle Flyer Data

on:
  schedule:
    # 毎月28日の日本時間 午前9:00 (UTC 0:00) に自動実行
    - cron: '0 0 28 * *'
  workflow_dispatch: # GitHubの管理画面から手動でいつでも実行できるトリガー

permissions:
  contents: write # リポジトリへの書き込み（commit & push）権限を付与

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 最大実行時間（タイムアウト対策）

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # キャッシュを有効化して実行時間を短縮

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper
        run: |
          python scraper.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 変更があるか確認
          git add data.json
          if git diff --staged --quiet; then
            echo "データに変更はありませんでした。"
          else
            git commit -m "chore: 毎月定期チラシデータ更新 [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "data.json を更新・プッシュしました。"
          fi
